name: Qt season click controlled diagnostic

on:
  push:
    branches: [codex/season-click-probe-20261107]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, geometry, popup, render]
    env:
      PYTHONPATH: 'app;tests;tools;experiments/qt_quick'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
      QT_CONTEXT_CLICK_PROBE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Pinned test dependencies (no Setup or publication)
        run: python -m pip install --disable-pip-version-check -r experiments/qt_quick/requirements-client.txt
      - name: Two isolated runs retain every failure
        shell: pwsh
        run: |
          $failed = @()
          foreach ($attempt in 1..2) {
            Write-Host "SEASON_CLICK_PROBE mode=$env:QT_CONTEXT_CLICK_PROBE attempt=$attempt source=$env:GITHUB_SHA"
            python -B -X utf8 -m unittest -v test_client_context_failure.ClientContextFailureTests.test_real_client_terminal_hotkey_supersedes_context_without_stuck_pending
            if ($LASTEXITCODE -ne 0) { $failed += $attempt }
          }
          if ($failed.Count -gt 0) {
            Write-Error ('Failed diagnostic attempts: ' + ($failed -join ', '))
            exit 1
          }
