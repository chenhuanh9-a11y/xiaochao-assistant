      - name: Independent modules retain every failure
        shell: pwsh
        run: |
          if (-not $env:XINGTU_JOINT_MODULES) { throw 'Test group selection did not complete' }
          $modules = @(ConvertFrom-Json -InputObject $env:XINGTU_JOINT_MODULES)
          if (-not $modules -or -not $modules.Count) { throw 'Test group selected no modules' }
          if ('${{ matrix.group }}' -eq 'tutorials') { $env:QT_SCALE_FACTOR = '1.5' }
          $failed = @()
          if ('${{ matrix.group }}' -eq 'features') {
            $modules += @('test_client_failure_notifications', 'test_s0_floor_search_boundary')
          }
          if ('${{ matrix.group }}' -eq 'packaging-imported-display') {
            $modules += 'test_client_original_browse'
          }
          if ('${{ matrix.group }}' -eq 'original-csharp') {
            $modules += @('test_qtifw_native_ui', 'test_qtifw_update_job', 'test_qtifw_bootstrap_packaging')
          }
          foreach ($module in $modules) {
            if ($module -eq 'test_runtime_environment_diagnostics') {
              # This module owns its FunctionTestCase runner; unittest discovery finds zero tests.
              python -B -X utf8 tests/test_runtime_environment_diagnostics.py
            } else {
              python -B -X utf8 -m unittest -v $module
            }
            if ($LASTEXITCODE -ne 0) { $failed += $module }
          }
          if ($failed.Count -gt 0) {
            Write-Error ('Failed modules: ' + ($failed -join ', '))
            exit 1
          }
