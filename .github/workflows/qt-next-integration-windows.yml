name: Qt next candidate joint Windows regression

on:
  push:
    branches: [integration/qt-next-20261102, integration/qt-pr84-88-20261103, codex/pr133-p3-p4-p5-integration-20261111, codex/pr133-shared-observation-stream-20261111]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [features, core, diagnostics, packaging, packaging-imported-data, packaging-imported-runtime, packaging-imported-activation, packaging-imported-display-data, packaging-imported-display, packaging-imported-display-integration, tutorials, map-defaults, season-ui, next-version-contracts, author-snapshots, installer-reset, fit-simulation, main-baseline, released-baseline]
    env:
      PYTHONPATH: 'app;tests;tools;experiments/qt_quick'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact released baseline (comparison, never candidate evidence)
        if: matrix.group == 'released-baseline'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 76dfa533b1249754148e388ab5c9a3b78ea96767
          persist-credentials: false
      - name: Exact pre-integration main (comparison only)
        if: matrix.group == 'main-baseline'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 8b147149d32262070ebeb7560a845d3400b740d2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Pinned dependencies (tests only, no Setup or publication)
        run: python -m pip install --disable-pip-version-check -r experiments/qt_quick/requirements-client.txt
      # Read-only eligibility evidence, not a Setup test or automatic approval.
      # A green step can report blocked; no subsequent step executes Setup.
      - name: Read-only native installer minimum prerequisites
        if: matrix.group == 'installer-reset'
        id: native-installer-preflight
        shell: pwsh
        run: |
          @'
          import json
          import os
          import re
          import sys

          report = {
              "schema": "xingtu-native-installer-environment-preflight-v1",
              "scope": "minimum-prerequisites-only",
              "interactiveShellSameSessionAndSid": False,
              "productionRegistration": [],
              "reasons": [],
              "setupStarted": False,
              "e2eValidated": False,
          }
          expected_app_id = "{D04394A0-DACE-4FF9-874D-3DCB43EE53D1}"
          key = "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\" + expected_app_id + "_is1"
          if os.name != "nt":
              report["reasons"].append("not-windows")
          else:
              sys.path.insert(0, "app")
              try:
                  from installer_native_observation import APP_ID, NativeObservationError, current_user_sid
              except Exception as error:
                  report["reasons"].append("observer-import-failed:" + type(error).__name__)
              else:
                  if APP_ID != expected_app_id:
                      report["reasons"].append("production-app-id-contract-changed")
                  else:
                      try:
                          current_user_sid()  # Never print or persist the returned SID.
                      except NativeObservationError as error:
                          code = getattr(error, "code", "")
                          report["reasons"].append(code if re.fullmatch(r"native-observation-[a-z0-9-]+", code) else "native-observation-unclassified")
                      except Exception as error:
                          report["reasons"].append("interactive-check-failed:" + type(error).__name__)
                      else:
                          report["interactiveShellSameSessionAndSid"] = True
              try:
                  import winreg
                  for hive_name, hive in (("HKCU", winreg.HKEY_CURRENT_USER), ("HKLM", winreg.HKEY_LOCAL_MACHINE)):
                      for view_name, view in (("32", winreg.KEY_WOW64_32KEY), ("64", winreg.KEY_WOW64_64KEY)):
                          row = {"hive": hive_name, "view": view_name, "state": "unknown"}
                          try:
                              with winreg.OpenKey(hive, key, 0, winreg.KEY_READ | view):
                                  row["state"] = "present"
                          except FileNotFoundError:
                              row["state"] = "absent"
                          except OSError as error:
                              row["error"] = "registry-read-error"
                              row["winerror"] = getattr(error, "winerror", None)
                          report["productionRegistration"].append(row)
                          if row["state"] != "absent":
                              report["reasons"].append("production-registration-" + row["state"] + ":" + hive_name + ":" + view_name)
              except Exception as error:
                  report["reasons"].append("registry-check-failed:" + type(error).__name__)

          registration_empty = len(report["productionRegistration"]) == 4 and all(row["state"] == "absent" for row in report["productionRegistration"])
          qualified = report["interactiveShellSameSessionAndSid"] and registration_empty and not report["reasons"]
          report["status"] = "minimum-preconditions-present" if qualified else "blocked"
          print(json.dumps(report, ensure_ascii=True, sort_keys=True, indent=2))
          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as stream:
                  stream.write("minimum_preconditions=" + ("true" if qualified else "false") + "\n")
                  stream.write("e2e_validated=false\n")
          '@ | python -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Inspect only. This does not validate a window driver, compile, install,
      # start a service, alter a desktop/security setting, or authorize Setup.
      - name: Read-only native installer desktop and compiler capabilities
        if: matrix.group == 'installer-reset'
        id: native-installer-capabilities
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $r = [ordered]@{ schema='xingtu-native-installer-capability-preflight-v1'; inputDesktopReadable=$false; inputDesktopSameAsThread=$false; uiAutomationRootReadable=$false; compiler=$null; reasons=@(); interactionDriverValidated=$false; setupStarted=$false; e2eValidated=$false }
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class XingtuDesktopReadOnly {
            [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
            [DllImport("user32.dll", SetLastError=true)] public static extern bool CloseDesktop(IntPtr handle);
            [DllImport("user32.dll")] public static extern IntPtr GetThreadDesktop(uint threadId);
            [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
            [DllImport("user32.dll", EntryPoint="GetUserObjectInformationW", CharSet=CharSet.Unicode, SetLastError=true)]
            private static extern bool GetUserObjectInformation(IntPtr handle, int index, StringBuilder buffer, uint length, out uint needed);
            public static string Name(IntPtr handle) {
              var text = new StringBuilder(512); uint needed;
              if (handle == IntPtr.Zero || !GetUserObjectInformation(handle, 2, text, 1024, out needed)) throw new InvalidOperationException("desktop-name-unreadable");
              return text.ToString();
            }
          }
          '@
            $desktop = [XingtuDesktopReadOnly]::OpenInputDesktop(0, $false, 1)
            if ($desktop -eq [IntPtr]::Zero) { $r.reasons += 'input-desktop-unreadable' }
            else {
              try {
                $r.inputDesktopReadable = $true
                $thread = [XingtuDesktopReadOnly]::GetThreadDesktop([XingtuDesktopReadOnly]::GetCurrentThreadId())
                $r.inputDesktopSameAsThread = [XingtuDesktopReadOnly]::Name($desktop) -ceq [XingtuDesktopReadOnly]::Name($thread)
                if (-not $r.inputDesktopSameAsThread) { $r.reasons += 'input-thread-desktop-mismatch' }
              } finally { [void][XingtuDesktopReadOnly]::CloseDesktop($desktop) }
            }
          } catch { $r.reasons += 'desktop-read-check-failed' }
          try {
            Add-Type -AssemblyName UIAutomationClient
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $id = $root.Current.ControlType.Id
            $r.uiAutomationRootReadable = ($null -ne $root -and $id -gt 0)
            if (-not $r.uiAutomationRootReadable) { $r.reasons += 'uia-root-unreadable' }
          } catch { $r.reasons += 'uia-root-read-failed' }
          try {
            $paths = @()
            $cmd = Get-Command ISCC.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            # Chocolatey can expose a launcher shim on PATH, not the compiler.
            # Inspect a standard installation first; never execute the shim.
            foreach ($base in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($base) { $paths += Join-Path $base 'Inno Setup 6\ISCC.exe' }
            }
            if ($cmd) { $paths += $cmd.Source }
            $path = $paths | Select-Object -Unique | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $path) { $r.reasons += 'compiler-not-found-in-known-locations' }
            else {
              $f = Get-Item -LiteralPath $path
              if (($f.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'compiler-reparse' }
              $sig = Get-AuthenticodeSignature -LiteralPath $path
              $r.compiler = [ordered]@{ fileName=$f.Name; fileVersion=$f.VersionInfo.FileVersion; productVersion=$f.VersionInfo.ProductVersion; bytes=$f.Length; sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant(); signatureStatus=[string]$sig.Status; signerSubject=$(if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { $null }) }
              $r.compiler.usedKnownInstallationInsteadOfPath = [bool]($cmd -and $path -cne $cmd.Source)
              if ($f.VersionInfo.ProductVersion -like '*Chocolatey Shim*') { $r.reasons += 'compiler-path-is-launcher-not-compiler' }
              if ($sig.Status -ne 'Valid') { $r.reasons += 'compiler-signature-not-valid' }
            }
          } catch { $r.reasons += 'compiler-inspection-failed' }
          $r.status = if ($r.reasons.Count -eq 0) { 'read-only-capabilities-present-not-e2e' } else { 'blocked' }
          $r | ConvertTo-Json -Depth 5
      - name: Independent modules retain every failure
        shell: pwsh
        run: |
          # Keep the baseline list limited to modules present at each bound ref.
          # This capability test was added after both baseline revisions.
          $core = @('test_client_settings', 'test_hotkey_layout_compat', 'test_client_manual_map', 'test_client_manual_map_integration', 'test_client_session', 'test_client_shutdown', 'test_client_coordinator', 'test_client_live_runtime', 'test_client_map_input', 'test_client_map_intent_reset', 'test_client_shortcut_delivery', 'test_client_input', 'test_client_capture_full', 'test_client_capture_exclusion')
          switch ('${{ matrix.group }}') {
            'tutorials' { $env:QT_SCALE_FACTOR = '1.5'; $modules = @('test_client_tutorial', 'test_client_paths', 'test_client_shutdown', 'test_client_shared_controls', 'test_client_control_layout', 'test_client_settings', 'test_independent_opacity_controls', 'test_legacy_tk_cleanup') }
            'features' { $modules = @('test_client_announcement_closing', 'test_concise_close_ui', 'test_client_home_announcement', 'test_client_recognition', 'test_s1_native_presentation', 'test_s1_recognition_readonly_ui', 'test_s0_template_recall', 'test_s0_bright_controls', 'test_s0_map_geometry_proof', 'test_s0_floor_ambiguity', 'test_client_image_memory', 'test_client_material_identity', 'test_client_aligned_transform', 'test_s0_expanded_search', 'test_client_announcement', 'test_update_service', 'test_client_chest_auto_tap', 'test_s0_vertical_controls', 'test_s0_vertical_detection', 'test_floor_contract', 'test_floor_observation_evidence', 'test_client_s0_vertical', 'test_client_game_floor_click', 'test_client_recapture_focus', 'test_client_recapture_composition', 'test_client_controls_visibility', 'test_client_chest_intent', 'test_chest_auto_tap', 'test_client_resource_feedback', 'test_client_window_feedback', 'test_client_fit_reporting', 'test_diagnostic_noninterference', 'test_client_floor_ready_policy', 'test_client_floor_ready_foreground_return', 'test_client_live_controls', 'test_client_floor_region', 'test_client_game_floor_input') }
            'core' { $modules = $core + @('test_client_map_round_separation', 'test_client_explicit_live_capability', 'test_client_explicit_rank_capability') }
            'released-baseline' { $modules = $core }
            'main-baseline' { $modules = $core }
            'diagnostics' { $modules = @('test_map_attempt_correlation', 'test_diagnostic_log_budget', 'test_client_problems', 'test_client_problem_history', 'test_client_info', 'test_client_season_failure_export', 'test_client_diagnostic_integration', 'test_client_joint_diagnostic_schema', 'test_field_failure_samples', 'test_async_event_log', 'test_automatic_failure_samples', 'test_storage_retention', 'test_memory_retention_links', 'test_runtime_environment_diagnostics'); $modules += @(Get-ChildItem tests/test_diagnostic*.py | ForEach-Object { $_.BaseName }) }
            'packaging' {
              # e116: this shard took 2m25s; the joint activation module took
              # 12m41s in the cancelled integration shard. Keep its full process.
              $modules = @('test_runtime_exclusions', 'test_s1_private_packaging', 'test_preview_windows_notice', 'test_qt_installer_directory', 'test_live_author_import', 'test_legacy_import_recovery', 'test_package_dependency_upgrade', 'test_receipt_dependency_contract', 'test_map_package_removal', 'test_client_resources', 'test_client_imported_author_joint_activation',
                'test_client_imported_activation_plan_ui')
            }
            # Separate parser/store and package-admission work from runtime tests
            # to avoid the former combined group's 25-minute cancellations.
            'packaging-imported-data' {
              $modules = @(
                'test_s0_predecessor_closure', 'test_s0_staged_closure',
                'test_resource_zip_io', 'test_resource_package_types', 'test_imported_resource_archive',
                'test_resource_snapshot_io_allocation',
                'test_imported_resource_packages', 'test_imported_resource_catalog',
                'test_imported_resource_selection', 'test_imported_resource_activation',
                'test_imported_resource_inventory', 'test_owned_directory_publication',
                'test_imported_array_archive', 'test_imported_resource_reader',
                'test_imported_structure_declarations', 'test_imported_legacy_structure_reader',
                'test_imported_legacy_references',
                'test_imported_controls_profile',
                'test_imported_s0_observation', 'test_identity_metadata_package_io',
                'test_shared_structure_package_io', 'test_shared_version_package_io',
                'test_entry_resource_io', 'test_main_entry_jobs', 'test_passport_entry_jobs', 'test_side_entry_jobs',
                'test_side_pose_recovery_jobs',
                'test_observation_work_scheduler',
                'test_source_structure_jobs', 'test_native_condition_jobs',
                'test_export_native_base_package',
                'test_export_s0_difficult_native_base_package',
                'test_export_s1_native_base_package', 'test_export_s1_nightmare_base_package',
                'test_imported_native_base', 'test_imported_native_admission_scope',
                'test_imported_group_registry',
                'test_imported_s1_native_base', 'test_imported_s1_controls_profile',
                'test_s1_imported_controls_equivalence',
                'test_entry_semantic_capability', 'test_imported_s1_native_context',
                'test_imported_difficult_native_context',
                # 6da runtime reached 25m; these complete modules used 6m31s.
                'test_client_imported_s1_nightmare_provider', 'test_client_imported_package_activation'
              )
            }
            # Provider/startup/activation tests retain the independent-process
            # runner and job cap; new shard completion still needs remote CI.
            'packaging-imported-runtime' {
              $modules = @(
                'test_s1_floor_observation', 'test_s1_map_ui_geometry',
                'test_client_shared_reference_context', 'test_client_structure_unification', 'test_client_local_identity_commit', 'test_group_review_lifecycle',
                'test_client_imported_providers', 'test_client_native_base_provider',
                'test_client_direct_structure_recognition', 'test_client_prepared_alignment', 'test_client_known_floor_recovery',
                'test_client_imported_s1_provider'
              )
            }
            # 7ef reached the unchanged 25m cap during the final S1 activation
            # UI module. Preserve every module and its separate process, with
            # provider/fit and activation/lifecycle work in separate jobs.
            'packaging-imported-activation' {
              $modules = @(
                'test_client_imported_difficult_provider', 'test_client_imported_difficult_activation_ui',
                'test_client_imported_group_registry', 'test_client_imported_group_runtime',
                'test_client_imported_admission',
                'test_client_imported_controls',
                'test_client_imported_activation', 'test_client_imported_activation_ui',
                'test_client_imported_s1_activation', 'test_client_imported_s1_activation_ui'
              )
            }
            # Author codecs/exporters and lifecycle consumers each use complete
            # native fixtures. Retain their separate-process runner and cap.
            'packaging-imported-display-data' {
              $modules = @(
                'test_imported_author_display', 'test_export_author_display_component',
                'test_export_author_display_component_modes',
                # e116: this shard took 6m54s; Fast used 4m34s in runtime.
                'test_client_imported_fast_structure',
                # 8165 runtime reached the 25m cap during service tests.
                'test_client_imported_resources', 'test_client_imported_resource_startup',
                'test_client_imported_file_dialog'
              )
            }
            'packaging-imported-display' {
              $modules = @(
                'test_client_progressive_display', 'test_client_progressive_pixels',
                'test_imported_author_displays',
                'test_client_imported_author_activation', 'test_client_imported_author_selection'
              )
            }
            # Joint B/C/display and actual QML flows have their own process
            # budget. e116's first three modules consumed 23m11s before the
            # fourth fixture setup; joint activation now uses packaging's room.
            'packaging-imported-display-integration' {
              $modules = @('test_client_imported_author_ui',
                'test_client_imported_browse', 'test_client_imported_browse_modes', 'test_client_imported_gallery_ui',
                'test_client_imported_activation_plan')
            }
            'season-ui' { $modules = @('test_s1_builtin_resources', 'test_probe_resource_context', 'test_season_settings', 'test_season_catalog', 'test_season_selector', 'test_season_selector_layout', 'test_season_gallery', 'test_season_resources', 'test_season_session', 'test_client_season_preparation', 'test_client_context_failure', 'test_settings_accessibility', 'test_client_gallery_actions', 'test_client_gallery_layout', 'test_client_gallery_resource_refresh') }
            'author-snapshots' { $modules = @('test_author_deferred_decode', 'test_s1_author_loading_work', 'test_author_snapshot_removal', 'test_client_snapshot_removal', 'test_author_resource_snapshots', 'test_author_snapshot_history', 'test_client_author_history', 'test_client_author_history_page', 'test_generic_author_package', 'test_generic_author_affine', 'test_generic_author_windows_paths', 'test_resource_transaction', 'test_map_package_upgrade', 'test_map_package_summary', 'test_client_author_snapshots', 'test_client_author_snapshot_recovery', 'test_client_author_snapshot_page', 'test_client_package_manager', 'test_star_map_recovery_helper', 'test_client_resource_recovery_lease', 'test_client_resource_startup_recovery', 'test_client_additions_recovery', 'test_client_import_upgrade_parity', 'test_generic_author_consumers', 'test_generic_author_startup') }
            # Real temporary files and native lease probes; no Setup execution,
            # registry mutation, user installation, or game operation in CI.
            'installer-reset' { $modules = @('test_addition_prepublication_recovery', 'test_linkless_package_publication', 'test_linkless_package_removal', 'test_linkless_download_adoption', 'test_download_cache_recovery', 'test_linkless_upgrade_reset', 'test_linkless_base_resources', 'test_resource_upgrade_reset', 'test_resource_reset_installer', 'test_resource_reset_snapshots', 'test_resource_reset_directory_history', 'test_resource_reset_legacy_protocol', 'test_upgrade_retirement', 'test_installer_committed_projection', 'test_installer_upgrade_journal', 'test_installer_upgrade_coordinator', 'test_installer_program_only', 'test_installer_coordinator_guards', 'test_installer_native_observation', 'test_installer_native_formats', 'test_installer_program_inventory', 'test_native_evidence_budget', 'test_resource_transaction', 'test_managed_base_absent_rollback', 'test_qt_installer_directory', 'test_qt_installer_reuse_guard', 'test_qt_installer_projection', 'test_qt_game_watcher_packaging', 'test_uninstall_data_wizard', 'test_qt_startup_failures', 'test_qt_startup_user_messages', 'test_client_resource_startup', 'test_client_resource_startup_recovery', 'test_client_author_snapshot_recovery') }
            # Generated pixels exercise real S0/S1 geometry; not real-game or end-to-end timing.
            'fit-simulation' { $modules = @(
                'test_observation_residual_reuse', 'test_structure_cache_memory',
                'test_idvb0059_runtime', 'test_idvb0059_retained_display', 'test_client_idvb0059_adapter',
                'test_prepared_idvb0059_input', 'test_structure_pose_inputs', 'test_structure_pose_preparation_context', 'test_prepared_structure_pose_solver',
                'test_recognition_race', 'test_structure_identity_index', 'test_structure_identity_floor_partition', 'test_structure_identity_resources',
                'test_structure_identity_resource_batch', 'test_structure_identity_read_operation',
                'test_structure_identity_observation', 'test_structure_identity_recognition',
                'test_structure_identity_corner_centre',
                'test_structure_identity_fixed_pose',
                'test_client_providers', 'test_feature_test_round_lock', 'test_s1_playtest_round_lock',
                'test_s1_playtest_round_lock_qml', 'test_s1_formal_round_lock', 'test_s1_resources_changed_chain',
                'test_s1_native_candidate_preview', 'test_wall_raster_local_distances', 'test_marker_implicit_domain',
                'test_marker_occluded_structure', 'test_explicit_component_alignment', 'test_structure_pose_resources',
                'test_s1_scan_observation_reuse', 'test_s1_fit_diagnostics', 'test_s1_manual_alignment',
                'test_s1_structure_selection', 'test_pose_prior_contract', 'test_s1_runtime_pose_prior',
                'test_shared_recovery_residual_contract', 'test_diagnostic_redaction', 'test_diagnostic_evidence',
                'test_g_cycle_replay', 'test_client_live_runtime'
              )
            }
            'next-version-contracts' { $modules = @('test_g_cycle_evidence', 'test_g_cycle_replay', 'test_client_g_cycle_evidence', 'test_client_g_cycle_solver_input', 'test_client_g_cycle_reporter', 'test_client_g_cycle_recovery', 'test_client_g_cycle_admission', 'test_client_g_cycle_composition', 'test_managed_base_absent_rollback', 'test_legacy_receipt_startup_retention', 'test_managed_base_resources', 'test_s1_normal_resource_retirement.NormalRetirementTests', 'test_resource_compatibility', 'test_game_startup', 'test_game_startup_service', 'test_game_startup_control', 'test_qt_startup_state', 'test_qt_startup_splash', 'test_client_startup_splash', 'test_client_lazy_pages', 'test_client_performance', 'test_client_package_progress', 'test_qt_game_watcher_packaging', 'test_qt_installer_reuse_guard', 'test_qt_installer_projection', 'test_uninstall_data_wizard', 'test_mixed_retired_author_package') }
            # Synthetic contracts only; unittest -v preserves each genuine skip reason.
            'map-defaults' { $modules = @('test_bundled_author_resources', 'test_package_profiles', 'test_client_paths', 'test_client_editor_upgrade', 'test_map_resource_context', 'test_qt_installer_projection') }
          }
          $failed = @()
          foreach ($module in $modules) {
            if ($module -eq 'test_runtime_environment_diagnostics') {
              # This module owns its FunctionTestCase runner; unittest discovery finds zero tests.
              python -B -X utf8 tests/test_runtime_environment_diagnostics.py
            } else {
              python -B -X utf8 -m unittest -v $module
            }
            if ($LASTEXITCODE -ne 0) { $failed += $module }
          }
          if ($failed.Count -gt 0) {
            Write-Error ('Failed modules: ' + ($failed -join ', '))
            exit 1
          }
