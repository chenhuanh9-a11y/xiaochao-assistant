name: Qt next candidate joint Windows regression

on:
  push:
    branches: [integration/qt-next-20261102, integration/qt-pr84-88-20261103, codex/pr133-p3-p4-p5-integration-20261111, codex/pr133-shared-observation-stream-20261111, codex/python-csharp-resource-integration-20261113]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [features, core, diagnostics, packaging, packaging-imported-data, packaging-imported-runtime, packaging-imported-activation, packaging-imported-display-data, packaging-imported-display, packaging-imported-display-integration, tutorials, map-defaults, season-ui, next-version-contracts, author-snapshots, installer-reset, fit-simulation, original-csharp, main-baseline, released-baseline]
    env:
      PYTHONPATH: 'app;tests;tools;experiments/qt_quick'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact released baseline (comparison, never candidate evidence)
        if: matrix.group == 'released-baseline'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 76dfa533b1249754148e388ab5c9a3b78ea96767
          persist-credentials: false
      - name: Exact pre-integration main (comparison only)
        if: matrix.group == 'main-baseline'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 8b147149d32262070ebeb7560a845d3400b740d2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Pinned dependencies (tests only, no Setup or publication)
        run: python -m pip install --disable-pip-version-check -r experiments/qt_quick/requirements-client.txt
      - name: Pinned packaging inventory dependencies
        if: matrix.group == 'original-csharp'
        run: python -m pip install --disable-pip-version-check -r tools/requirements-qt-build.txt
      - name: Original grid SDK
        if: matrix.group == 'original-csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.403'
      - name: Build the real self-contained grid service
        if: matrix.group == 'original-csharp'
        shell: pwsh
        run: |
          $gridOutput = Join-Path $env:RUNNER_TEMP 'xingtu-grid-service'
          $gridArtifacts = Join-Path $env:RUNNER_TEMP 'xingtu-grid-build'
          dotnet publish hybrid/StarMap.Grid/StarMap.Grid.csproj -c Release -r win-x64 --self-contained true --artifacts-path $gridArtifacts --output $gridOutput --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ('STARMAP_DOTNET=' + (Get-Command dotnet).Source) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('STARMAP_GRID_EXE=' + (Join-Path $gridOutput 'StarMap.Grid.exe')) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Read-only eligibility evidence, not a Setup test or automatic approval.
      # A green step can report blocked; no subsequent step executes Setup.
      - name: Read-only native installer minimum prerequisites
        if: matrix.group == 'installer-reset'
        id: native-installer-preflight
        shell: pwsh
        run: |
          @'
          import json
          import os
          import re
          import sys

          report = {
              "schema": "xingtu-native-installer-environment-preflight-v1",
              "scope": "minimum-prerequisites-only",
              "interactiveShellSameSessionAndSid": False,
              "productionRegistration": [],
              "reasons": [],
              "setupStarted": False,
              "e2eValidated": False,
          }
          expected_app_id = "{D04394A0-DACE-4FF9-874D-3DCB43EE53D1}"
          key = "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\" + expected_app_id + "_is1"
          if os.name != "nt":
              report["reasons"].append("not-windows")
          else:
              sys.path.insert(0, "app")
              try:
                  from installer_native_observation import APP_ID, NativeObservationError, current_user_sid
              except Exception as error:
                  report["reasons"].append("observer-import-failed:" + type(error).__name__)
              else:
                  if APP_ID != expected_app_id:
                      report["reasons"].append("production-app-id-contract-changed")
                  else:
                      try:
                          current_user_sid()  # Never print or persist the returned SID.
                      except NativeObservationError as error:
                          code = getattr(error, "code", "")
                          report["reasons"].append(code if re.fullmatch(r"native-observation-[a-z0-9-]+", code) else "native-observation-unclassified")
                      except Exception as error:
                          report["reasons"].append("interactive-check-failed:" + type(error).__name__)
                      else:
                          report["interactiveShellSameSessionAndSid"] = True
              try:
                  import winreg
                  for hive_name, hive in (("HKCU", winreg.HKEY_CURRENT_USER), ("HKLM", winreg.HKEY_LOCAL_MACHINE)):
                      for view_name, view in (("32", winreg.KEY_WOW64_32KEY), ("64", winreg.KEY_WOW64_64KEY)):
                          row = {"hive": hive_name, "view": view_name, "state": "unknown"}
                          try:
                              with winreg.OpenKey(hive, key, 0, winreg.KEY_READ | view):
                                  row["state"] = "present"
                          except FileNotFoundError:
                              row["state"] = "absent"
                          except OSError as error:
                              row["error"] = "registry-read-error"
                              row["winerror"] = getattr(error, "winerror", None)
                          report["productionRegistration"].append(row)
                          if row["state"] != "absent":
                              report["reasons"].append("production-registration-" + row["state"] + ":" + hive_name + ":" + view_name)
              except Exception as error:
                  report["reasons"].append("registry-check-failed:" + type(error).__name__)

          registration_empty = len(report["productionRegistration"]) == 4 and all(row["state"] == "absent" for row in report["productionRegistration"])
          qualified = report["interactiveShellSameSessionAndSid"] and registration_empty and not report["reasons"]
          report["status"] = "minimum-preconditions-present" if qualified else "blocked"
          print(json.dumps(report, ensure_ascii=True, sort_keys=True, indent=2))
          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as stream:
                  stream.write("minimum_preconditions=" + ("true" if qualified else "false") + "\n")
                  stream.write("e2e_validated=false\n")
          '@ | python -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Inspect only. This does not validate a window driver, compile, install,
      # start a service, alter a desktop/security setting, or authorize Setup.
      - name: Read-only native installer desktop and compiler capabilities
        if: matrix.group == 'installer-reset'
        id: native-installer-capabilities
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $r = [ordered]@{ schema='xingtu-native-installer-capability-preflight-v1'; inputDesktopReadable=$false; inputDesktopSameAsThread=$false; uiAutomationRootReadable=$false; compiler=$null; reasons=@(); interactionDriverValidated=$false; setupStarted=$false; e2eValidated=$false }
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class XingtuDesktopReadOnly {
            [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
            [DllImport("user32.dll", SetLastError=true)] public static extern bool CloseDesktop(IntPtr handle);
            [DllImport("user32.dll")] public static extern IntPtr GetThreadDesktop(uint threadId);
            [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
            [DllImport("user32.dll", EntryPoint="GetUserObjectInformationW", CharSet=CharSet.Unicode, SetLastError=true)]
            private static extern bool GetUserObjectInformation(IntPtr handle, int index, StringBuilder buffer, uint length, out uint needed);
            public static string Name(IntPtr handle) {
              var text = new StringBuilder(512); uint needed;
              if (handle == IntPtr.Zero || !GetUserObjectInformation(handle, 2, text, 1024, out needed)) throw new InvalidOperationException("desktop-name-unreadable");
              return text.ToString();
            }
          }
          '@
            $desktop = [XingtuDesktopReadOnly]::OpenInputDesktop(0, $false, 1)
            if ($desktop -eq [IntPtr]::Zero) { $r.reasons += 'input-desktop-unreadable' }
            else {
              try {
                $r.inputDesktopReadable = $true
                $thread = [XingtuDesktopReadOnly]::GetThreadDesktop([XingtuDesktopReadOnly]::GetCurrentThreadId())
                $r.inputDesktopSameAsThread = [XingtuDesktopReadOnly]::Name($desktop) -ceq [XingtuDesktopReadOnly]::Name($thread)
                if (-not $r.inputDesktopSameAsThread) { $r.reasons += 'input-thread-desktop-mismatch' }
              } finally { [void][XingtuDesktopReadOnly]::CloseDesktop($desktop) }
            }
          } catch { $r.reasons += 'desktop-read-check-failed' }
          try {
            Add-Type -AssemblyName UIAutomationClient
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $id = $root.Current.ControlType.Id
            $r.uiAutomationRootReadable = ($null -ne $root -and $id -gt 0)
            if (-not $r.uiAutomationRootReadable) { $r.reasons += 'uia-root-unreadable' }
          } catch { $r.reasons += 'uia-root-read-failed' }
          try {
            $paths = @()
            $cmd = Get-Command ISCC.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            # Chocolatey can expose a launcher shim on PATH, not the compiler.
            # Inspect a standard installation first; never execute the shim.
            foreach ($base in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($base) { $paths += Join-Path $base 'Inno Setup 6\ISCC.exe' }
            }
            if ($cmd) { $paths += $cmd.Source }
            $path = $paths | Select-Object -Unique | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $path) { $r.reasons += 'compiler-not-found-in-known-locations' }
            else {
              $f = Get-Item -LiteralPath $path
              if (($f.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'compiler-reparse' }
              $sig = Get-AuthenticodeSignature -LiteralPath $path
              $r.compiler = [ordered]@{ fileName=$f.Name; fileVersion=$f.VersionInfo.FileVersion; productVersion=$f.VersionInfo.ProductVersion; bytes=$f.Length; sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant(); signatureStatus=[string]$sig.Status; signerSubject=$(if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { $null }) }
              $r.compiler.usedKnownInstallationInsteadOfPath = [bool]($cmd -and $path -cne $cmd.Source)
              if ($f.VersionInfo.ProductVersion -like '*Chocolatey Shim*') { $r.reasons += 'compiler-path-is-launcher-not-compiler' }
              if ($sig.Status -ne 'Valid') { $r.reasons += 'compiler-signature-not-valid' }
            }
          } catch { $r.reasons += 'compiler-inspection-failed' }
          $r.status = if ($r.reasons.Count -eq 0) { 'read-only-capabilities-present-not-e2e' } else { 'blocked' }
          $r | ConvertTo-Json -Depth 5
      # Keep each inline command within GitHub's 21,000-character limit.
      # Selection is split; execution and failure collection remain shared.
      - name: Select core and resource test groups
        id: select_core
        if: contains(fromJSON('["tutorials","features","core","released-baseline","main-baseline","diagnostics","packaging","packaging-imported-data","packaging-imported-runtime"]'), matrix.group)
        shell: pwsh
        run: |
          # Keep the baseline list limited to modules present at each bound ref.
          # This capability test was added after both baseline revisions.
          $core = @('test_client_settings', 'test_hotkey_layout_compat', 'test_client_manual_map', 'test_client_manual_map_integration', 'test_client_session', 'test_client_shutdown', 'test_client_coordinator', 'test_client_live_runtime', 'test_client_map_input', 'test_client_map_intent_reset', 'test_client_shortcut_delivery', 'test_client_input', 'test_client_capture_full', 'test_client_capture_exclusion')
          switch ('${{ matrix.group }}') {
            'tutorials' { $modules = @('test_client_tutorial', 'test_client_paths', 'test_client_shutdown', 'test_client_shared_controls', 'test_client_control_layout', 'test_client_settings', 'test_independent_opacity_controls', 'test_legacy_tk_cleanup') }
            'features' { $modules = @('test_client_announcement_closing', 'test_concise_close_ui', 'test_client_home_announcement', 'test_client_recognition', 'test_s1_native_presentation', 'test_s1_recognition_readonly_ui', 'test_s0_template_recall', 'test_s0_bright_controls', 'test_s0_map_geometry_proof', 'test_s0_floor_ambiguity', 'test_client_image_memory', 'test_client_material_identity', 'test_client_aligned_transform', 'test_s0_expanded_search', 'test_client_announcement', 'test_update_service', 'test_client_chest_auto_tap', 'test_s0_vertical_controls', 'test_s0_vertical_detection', 'test_floor_contract', 'test_floor_observation_evidence', 'test_client_s0_vertical', 'test_client_game_floor_click', 'test_client_recapture_focus', 'test_client_recapture_composition', 'test_client_controls_visibility', 'test_client_chest_intent', 'test_chest_auto_tap', 'test_client_resource_feedback', 'test_client_window_feedback', 'test_client_fit_reporting', 'test_diagnostic_noninterference', 'test_client_floor_ready_policy', 'test_client_floor_ready_foreground_return', 'test_client_live_controls', 'test_client_floor_region', 'test_client_game_floor_input') }
            'core' { $modules = $core + @('test_client_map_round_separation', 'test_client_explicit_live_capability', 'test_client_explicit_rank_capability') }
            'released-baseline' { $modules = $core }
            'main-baseline' { $modules = $core }
            'diagnostics' { $modules = @('test_map_attempt_correlation', 'test_diagnostic_log_budget', 'test_client_problems', 'test_client_problem_history', 'test_client_info', 'test_client_season_failure_export', 'test_client_diagnostic_integration', 'test_client_joint_diagnostic_schema', 'test_field_failure_samples', 'test_async_event_log', 'test_automatic_failure_samples', 'test_storage_retention', 'test_memory_retention_links', 'test_runtime_environment_diagnostics'); $modules += @(Get-ChildItem tests/test_diagnostic*.py | ForEach-Object { $_.BaseName }) }
            'packaging' {
              # e116: this shard took 2m25s; the joint activation module took
              # 12m41s in the cancelled integration shard. Keep its full process.
              $modules = @('test_runtime_exclusions', 'test_s1_private_packaging', 'test_preview_windows_notice', 'test_qt_installer_directory', 'test_live_author_import', 'test_legacy_import_recovery', 'test_package_dependency_upgrade', 'test_receipt_dependency_contract', 'test_map_package_removal', 'test_client_resources', 'test_client_imported_author_joint_activation',
                'test_client_imported_activation_plan_ui')
            }
            # Separate parser/store and package-admission work from runtime tests
            # to avoid the former combined group's 25-minute cancellations.
            'packaging-imported-data' {
              $modules = @(
                'test_s0_predecessor_closure', 'test_s0_staged_closure',
                'test_resource_zip_io', 'test_resource_package_types', 'test_imported_resource_archive',
                'test_resource_snapshot_io_allocation',
                'test_imported_resource_packages', 'test_imported_resource_catalog',
                'test_imported_resource_selection', 'test_imported_resource_activation',
                'test_imported_resource_inventory', 'test_imported_resource_removal', 'test_owned_directory_publication',
                'test_imported_array_archive', 'test_imported_resource_reader',
                'test_imported_structure_declarations', 'test_imported_legacy_structure_reader',
                'test_imported_legacy_references',
                # The original observer owns algorithm parameters. Preserve
                # package decoding/currentness checks, without P3 parameter injection.
                'test_imported_controls_profile.ImportedControlsProfileTests.test_reads_real_declared_package_and_exposes_immutable_s0_contexts',
                'test_imported_controls_profile.ImportedControlsProfileTests.test_entrypoint_must_match_component_s0_contexts_and_contracts',
                'test_imported_controls_profile.ImportedControlsProfileTests.test_package_floor_ids_are_external_metadata_for_supported_observations',
                'test_imported_controls_profile.ImportedControlsProfileTests.test_component_declaring_any_s1_context_is_rejected_explicitly',
                'test_imported_controls_profile.ImportedControlsProfileTests.test_regions_detector_family_and_all_competitor_labels_are_required',
                'test_imported_controls_profile.ImportedControlsProfileTests.test_npy_shape_dtype_length_nan_and_row_labels_are_checked',
                'test_imported_controls_profile.ImportedControlsProfileTests.test_cached_context_checks_catalog_and_actual_manifest_identity',
                'test_imported_controls_profile.ImportedControlsProfileTests.test_undeclared_npy_and_stale_catalog_guard_fail_without_fallback',
                'test_imported_s0_observation.OriginalS0ControlsLifecycleTests', 'test_identity_metadata_package_io',
                'test_shared_structure_package_io', 'test_shared_version_package_io',
                # Guarded readers remain; the restored low-level algorithm's
                # old constructor shape is no longer the admission boundary.
                # Entry complexity is checked by current original-base import.
                'test_entry_resource_io.EntryResourceIOTests.test_constructors_read_all_declared_children_and_match_original_arrays',
                'test_entry_resource_io.EntryResourceIOTests.test_declared_typed_index_and_door_rejection_never_use_default_disk_index',
                'test_entry_resource_io.EntryResourceIOTests.test_expired_view_rejects_constructor_and_lazy_exit_without_disk_fallback',
                'test_entry_resource_io.EntryResourceIOTests.test_identity_engine_threads_reader_into_both_entries_and_lazy_exit',
                'test_entry_resource_io.EntryResourceIOTests.test_lazy_exit_uses_same_reader_on_first_actual_observation',
                'test_entry_resource_io.EntryResourceIOTests.test_optional_npz_and_passports_cannot_fall_back_to_valid_undeclared_files',
                'test_entry_resource_io.EntryResourceIOTests.test_taxonomy_and_audited_reference_image_use_reader_and_match_disk_decode',
                'test_entry_resource_io.EntryResourceIOTests.test_undeclared_and_changed_main_file_fail_even_when_disk_decoder_works',
                # Keep original comparator and shared wall primitives. The
                # later icon-qualified comparator is outside the donor path.
                'test_s1_common_wall_evidence.CommonWallEvidenceTests.test_actual_missing_walls_still_exclude_the_wrong_reference',
                'test_s1_common_wall_evidence.CommonWallEvidenceTests.test_real_wall_conflict_still_recovers_a_fully_incompatible_pool',
                'test_s1_common_wall_evidence.CommonWallEvidenceTests.test_diagonal_wall_still_excludes_a_reference_missing_it',
                'test_s1_common_wall_evidence.CommonWallEvidenceTests.test_faint_wall_keeps_relative_contrast_measurement',
                'test_s1_common_wall_evidence.CommonWallEvidenceTests.test_crop_boundary_is_not_a_wall',
                'test_s1_common_wall_evidence.CommonWallEvidenceTests.test_short_or_broken_runs_stay_unknown_without_changing_raw_pixels',
                'test_s1_common_wall_evidence.CommonWallEvidenceTests.test_diagonal_length_boundary_counts_arc_samples_not_unique_pixels',
                # Normalized P3 base/solver contracts are retired. Current
                # producer -> import -> consumers run in original-csharp.
                'test_export_native_base_package.NativeBaseExporterTests.test_existing_output_is_preserved_and_output_inside_source_is_rejected',
                'test_export_native_base_package.NativeBaseExporterTests.test_partial_output_copy_failure_allows_a_complete_retry',
                'test_export_native_base_package.NativeBaseExporterTests.test_flush_and_fsync_failures_leave_no_final_output_and_allow_retry',
                'test_export_native_base_package.NativeBaseExporterTests.test_replaced_temporary_is_preserved_and_does_not_block_final_retry',
                'test_export_native_base_package.NativeBaseExporterTests.test_final_output_created_by_another_writer_is_never_replaced_or_removed',
                'test_imported_s1_controls_profile.ImportedS1Controls.test_real_package_decodes_immutable_exact_contexts',
                'test_imported_s1_controls_profile.ImportedS1Controls.test_missing_fields_wrong_schema_and_exact_floor_contracts_rejected',
                'test_imported_s1_controls_profile.ImportedS1Controls.test_nonfinite_and_bounded_shape_parameters_rejected',
                'test_imported_s1_controls_profile.ImportedS1Controls.test_current_view_guard_blocks_cached_parameters_before_and_after_pixels',
                'test_imported_s1_controls_profile.ImportedS1Controls.test_package_manifest_and_payload_integrity_are_not_bypassed',
                # Optional semantics belong to original package admission;
                # the donor low-level constructors do not accept P3 flags.
                'test_original_qt_resource_flow.OriginalQtResourceFlowTests.test_original_contexts_preserve_legitimate_optional_capability_gaps',
                'test_original_qt_resource_flow.OriginalQtResourceFlowTests.test_consumed_declared_optional_schema_is_rejected_before_activation',
                'test_original_qt_resource_flow.OriginalQtResourceFlowTests.test_absent_and_legitimately_empty_optional_sources_remain_available',
                'test_client_imported_package_activation'
              )
            }
            # Provider/startup/activation tests retain the independent-process
            # runner and job cap; new shard completion still needs remote CI.
            'packaging-imported-runtime' {
              $modules = @(
                'test_s1_floor_observation',
                # Original shape proofs remain. P3 sampled exclusions/gain
                # and its independent UI producer are retired, not reattached.
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_complete_group_at_multiple_scales',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_each_shape_missing_and_uniform_shape_colored_tile_rejected',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_one_close_diagonal_or_orthogonal_cross_is_not_x',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_plus_and_minus_have_different_strokes',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_missing_or_interrupted_rail_is_not_control_group',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_only_x_or_only_plus_or_only_rail_never_proves_map',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_displaced_plus_cannot_match_unrelated_x_and_minus',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_wrong_vertical_spacing_rejected',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_duplicate_close_glyphs_are_ambiguous',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_shapes_inside_floor_region_do_not_supply_evidence',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_shape_observer_does_not_mutate_input',
                'test_s1_map_ui_geometry.S1MapUiGeometry.test_bad_type_size_and_uniform_frames_fail_closed',
                'test_client_shared_reference_context',
                'test_client_imported_providers', 'test_client_native_base_provider',
                # P3 proposal-only eligibility/scoped cohort orchestration is
                # retired; keep donor fixed-map geometry and cancellation.
                'test_client_known_floor_recovery.KnownFloorRecoveryTests.test_main_fixed_map_pose_without_floor_supplies_geometry_only',
                'test_client_known_floor_recovery.KnownFloorRecoveryTests.test_real_side_adjudicator_accepts_complete_unique_fixed_map_pose',
                'test_client_known_floor_recovery.KnownFloorRecoveryTests.test_incomplete_or_same_map_ambiguous_pose_never_becomes_a_fit',
                'test_client_known_floor_recovery.KnownFloorRecoveryTests.test_single_regional_candidate_uses_original_refinement_and_verifier',
                'test_client_known_floor_recovery.KnownFloorRecoveryTests.test_foreign_candidate_or_refinement_cannot_change_selected_map',
                'test_client_known_floor_recovery.KnownFloorRecoveryTests.test_no_recovery_for_verified_target_unregistered_or_non_entry_first',
                'test_client_known_floor_recovery.KnownFloorRecoveryTests.test_cancellation_before_and_after_each_producer_is_terminal',
                'test_client_known_floor_recovery.KnownFloorRecoveryTests.test_resource_error_semantics_do_not_turn_missing_main_into_broad_search'
              )
            }
          }
          ('XINGTU_JOINT_MODULES=' + (ConvertTo-Json -InputObject @($modules) -Compress)) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Select display and fitting test groups
        if: steps.select_core.outcome == 'skipped'
        shell: pwsh
