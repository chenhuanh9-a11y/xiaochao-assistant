name: Qt next candidate joint Windows regression

on:
  push:
    branches: [integration/qt-next-20261102, integration/qt-pr84-88-20261103]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [features, core, diagnostics, packaging, tutorials, map-defaults, season-ui, next-version-contracts, author-snapshots, installer-reset, fit-simulation, main-baseline, released-baseline]
    env:
      PYTHONPATH: 'app;tests;tools;experiments/qt_quick'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact released baseline (comparison, never candidate evidence)
        if: matrix.group == 'released-baseline'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 76dfa533b1249754148e388ab5c9a3b78ea96767
          persist-credentials: false
      - name: Exact pre-integration main (comparison only)
        if: matrix.group == 'main-baseline'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 8b147149d32262070ebeb7560a845d3400b740d2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Pinned dependencies (tests only, no Setup or publication)
        run: python -m pip install --disable-pip-version-check -r experiments/qt_quick/requirements-client.txt
      - name: Independent modules retain every failure
        shell: pwsh
        run: |
          $core = @('test_client_settings', 'test_hotkey_layout_compat', 'test_client_manual_map', 'test_client_manual_map_integration', 'test_client_session', 'test_client_shutdown', 'test_client_coordinator', 'test_client_live_runtime', 'test_client_map_input', 'test_client_map_intent_reset', 'test_client_shortcut_delivery', 'test_client_input', 'test_client_capture_full', 'test_client_capture_exclusion')
          switch ('${{ matrix.group }}') {
            'tutorials' { $env:QT_SCALE_FACTOR = '1.5'; $modules = @('test_client_tutorial', 'test_client_paths', 'test_client_shutdown', 'test_client_shared_controls', 'test_client_control_layout', 'test_client_settings', 'test_independent_opacity_controls', 'test_legacy_tk_cleanup') }
            'features' { $modules = @('test_s0_template_recall', 'test_s0_bright_controls', 'test_s0_map_geometry_proof', 'test_s0_floor_ambiguity', 'test_client_image_memory', 'test_client_material_identity', 'test_client_aligned_transform', 'test_s0_expanded_search', 'test_client_announcement', 'test_update_service', 'test_client_chest_auto_tap', 'test_s0_vertical_controls', 'test_s0_vertical_detection', 'test_floor_contract', 'test_floor_observation_evidence', 'test_client_s0_vertical', 'test_client_game_floor_click', 'test_client_recapture_focus', 'test_client_recapture_composition', 'test_client_controls_visibility', 'test_client_chest_intent', 'test_chest_auto_tap', 'test_client_resource_feedback', 'test_client_window_feedback', 'test_client_fit_reporting', 'test_diagnostic_noninterference', 'test_client_floor_ready_policy', 'test_client_floor_ready_foreground_return', 'test_client_live_controls', 'test_client_floor_region', 'test_client_game_floor_input') }
            'core' { $modules = $core }
            'released-baseline' { $modules = $core }
            'main-baseline' { $modules = $core }
            'diagnostics' { $modules = @('test_diagnostic_log_budget', 'test_client_problems', 'test_client_problem_history', 'test_client_info', 'test_client_diagnostic_integration', 'test_client_joint_diagnostic_schema', 'test_field_failure_samples', 'test_async_event_log', 'test_automatic_failure_samples', 'test_storage_retention', 'test_memory_retention_links', 'test_runtime_environment_diagnostics'); $modules += @(Get-ChildItem tests/test_diagnostic*.py | ForEach-Object { $_.BaseName }) }
            'packaging' { $modules = @('test_preview_windows_notice', 'test_qt_installer_directory', 'test_live_author_import', 'test_legacy_import_recovery', 'test_package_dependency_upgrade', 'test_receipt_dependency_contract', 'test_map_package_removal', 'test_client_resources') }
            'season-ui' { $modules = @('test_season_settings', 'test_season_catalog', 'test_season_selector', 'test_season_gallery', 'test_season_resources', 'test_season_session', 'test_client_season_preparation', 'test_client_context_failure', 'test_settings_accessibility', 'test_client_gallery_actions', 'test_client_gallery_layout', 'test_client_gallery_resource_refresh') }
            'author-snapshots' { $modules = @('test_author_resource_snapshots', 'test_generic_author_package', 'test_generic_author_affine', 'test_generic_author_windows_paths', 'test_resource_transaction', 'test_map_package_upgrade', 'test_map_package_summary', 'test_client_author_snapshots', 'test_client_author_snapshot_recovery', 'test_client_author_snapshot_page', 'test_client_package_manager', 'test_star_map_recovery_helper', 'test_client_resource_recovery_lease', 'test_client_resource_startup_recovery', 'test_client_additions_recovery', 'test_client_import_upgrade_parity', 'test_generic_author_consumers', 'test_generic_author_startup') }
            # Real temporary files and native lease probes; no Setup execution,
            # registry mutation, user installation, or game operation in CI.
            'installer-reset' { $modules = @('test_resource_upgrade_reset', 'test_resource_reset_installer', 'test_resource_reset_snapshots', 'test_resource_reset_directory_history', 'test_resource_reset_legacy_protocol', 'test_upgrade_retirement', 'test_installer_committed_projection', 'test_installer_upgrade_journal', 'test_installer_upgrade_coordinator', 'test_installer_coordinator_guards', 'test_installer_native_observation', 'test_installer_native_formats', 'test_installer_program_inventory', 'test_native_evidence_budget', 'test_resource_transaction', 'test_managed_base_absent_rollback', 'test_qt_installer_directory', 'test_qt_installer_reuse_guard', 'test_qt_installer_projection', 'test_qt_game_watcher_packaging', 'test_uninstall_data_wizard', 'test_qt_startup_failures', 'test_qt_startup_user_messages', 'test_client_resource_startup', 'test_client_resource_startup_recovery', 'test_client_author_snapshot_recovery') }
            # Generated pixels exercise real S0/S1 geometry; not real-game or end-to-end timing.
            'fit-simulation' { $modules = @('test_wall_raster_local_distances', 'test_marker_implicit_domain', 'test_marker_occluded_structure', 'test_explicit_component_alignment', 'test_s1_scan_observation_reuse', 'test_s1_fit_diagnostics', 'test_s1_manual_alignment', 'test_s1_structure_selection', 'test_pose_prior_contract', 'test_s1_runtime_pose_prior', 'test_shared_recovery_residual_contract', 'test_diagnostic_redaction', 'test_diagnostic_evidence', 'test_g_cycle_replay', 'test_client_live_runtime') }
            'next-version-contracts' { $modules = @('test_g_cycle_evidence', 'test_g_cycle_replay', 'test_client_g_cycle_evidence', 'test_client_g_cycle_solver_input', 'test_client_g_cycle_reporter', 'test_client_g_cycle_recovery', 'test_client_g_cycle_admission', 'test_client_g_cycle_composition', 'test_managed_base_absent_rollback', 'test_legacy_receipt_startup_retention', 'test_managed_base_resources', 'test_s1_normal_resource_retirement.NormalRetirementTests', 'test_resource_compatibility', 'test_game_startup', 'test_game_startup_service', 'test_game_startup_control', 'test_qt_startup_state', 'test_qt_startup_splash', 'test_client_startup_splash', 'test_client_lazy_pages', 'test_client_performance', 'test_client_package_progress', 'test_qt_game_watcher_packaging', 'test_qt_installer_reuse_guard', 'test_qt_installer_projection', 'test_uninstall_data_wizard', 'test_mixed_retired_author_package') }
            # Synthetic contracts only; unittest -v preserves each genuine skip reason.
            'map-defaults' { $modules = @('test_bundled_author_resources', 'test_package_profiles', 'test_client_paths', 'test_client_editor_upgrade', 'test_map_resource_context', 'test_qt_installer_projection') }
          }
          $failed = @()
          foreach ($module in $modules) {
            if ($module -eq 'test_runtime_environment_diagnostics') {
              # This module owns its FunctionTestCase runner; unittest discovery finds zero tests.
              python -B -X utf8 tests/test_runtime_environment_diagnostics.py
            } else {
              python -B -X utf8 -m unittest -v $module
            }
            if ($LASTEXITCODE -ne 0) { $failed += $module }
          }
          if ($failed.Count -gt 0) {
            Write-Error ('Failed modules: ' + ($failed -join ', '))
            exit 1
          }
