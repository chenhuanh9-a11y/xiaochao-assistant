name: C# phase-1 Linux slice
on:
  pull_request:
    paths:
      - 'csharp/**'
      - 'tools/phase1/**'
      - '.github/workflows/csharp-phase1-linux.yml'
  push:
    branches:
      - 'cursor/csharp-phase1-skeleton-6c9f'
permissions:
  contents: read
jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: NumPy pin and OpenCV import dependency
        run: |
          python -m pip install 'numpy==2.2.6' opencv-python-headless
          python -m pip install 'numpy==2.2.6'
      - name: Build class library, CLI, and tests
        run: dotnet build csharp/StarMap.Linux.sln -c Release
      - name: Reliability and policy tests
        run: dotnet run --project csharp/tests/StarMap.Core.Tests/StarMap.Core.Tests.csproj -c Release --no-build
      - name: Strict Python/C# grid parity
        run: python tools/phase1/compare_grid_slice.py
      - name: Publish measurement scaffold
        run: python tools/phase1/measure_publish.py
