name: Qt shortcuts Windows (physical-state and layout fixtures)

on:
  push:
    branches: [fix/qt-modifier-main-ci-20261102, test/qt-shortcut-fixture-readiness-20261102]
  pull_request:
    paths:
      - 'app/**'
      - 'experiments/qt_quick/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/qt-modifier-shortcuts-windows.yml'

permissions:
  contents: read

jobs:
  shortcuts:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'app;tests;tools;experiments/qt_quick'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Install pinned test dependencies (no build/release tools)
        id: dependencies
        run: |
          python -m pip install --disable-pip-version-check PySide6-Essentials==6.11.1 shiboken6==6.11.1 numpy==2.2.6 opencv-python-headless==4.12.0.88 Pillow==12.3.0 psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shortcut regression suite (native packets are fixtures)
        run: |
          python -B -X utf8 -m unittest -v test_client_modifier_shortcuts test_client_native_key_state test_client_native_mouse test_client_input_event_freshness test_client_input_recovery test_client_shortcut_delivery test_client_settings test_client_input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: External LL review - 11 enhanced cases plus held and unknown counterexamples
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -X utf8 -m unittest -v test_review_ll_real
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Settings save reload restart dispatch - 20 independent processes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          $failed = @()
          foreach ($attempt in 1..20) {
            Write-Output "::group::Settings independent process $attempt / 20"
            python -B -X utf8 -m unittest -v test_client_shortcut_delivery.ShortcutDeliveryTests.test_actual_settings_controls_save_hot_reload_restart_and_dispatch
            $code = $LASTEXITCODE
            Write-Output "Attempt $attempt exit code: $code"
            Write-Output '::endgroup::'
            if ($code -ne 0) { $failed += $attempt }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed independent processes: $($failed -join ', ')"
            exit 1
          }
          Write-Output 'All 20 independent processes passed.'
      - name: Existing coordinator, onboarding, compatibility and floor contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -X utf8 -m unittest -v test_client_onboarding test_client_coordinator test_hotkey_layout_compat test_client_floor_region
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
