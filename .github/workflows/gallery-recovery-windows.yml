name: Gallery recovery compatibility Windows regression

on:
  push:
    branches: [cloud/gallery-recovery-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-recovery:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [candidate, main-baseline]
    env:
      PYTHONPATH: 'app;tests;tools;experiments/qt_quick'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    steps:
      - name: Check out candidate or exact main comparison
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.revision == 'main-baseline' && 'bb9e210cdce48e5bd4980c9819d80051a60500cc' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Pinned test dependencies (no build or release)
        run: python -m pip install --disable-pip-version-check -r experiments/qt_quick/requirements-client.txt
      - name: Gallery and recovery modules (baseline is comparison, not candidate evidence)
        shell: pwsh
        run: |
          $failed = @()
          foreach ($module in @('test_data_recovery', 'test_custom_maps', 'test_client_custom_gallery')) {
            python -B -X utf8 -m unittest -v $module
            if ($LASTEXITCODE -ne 0) { $failed += $module }
          }
          if ($failed.Count -gt 0) {
            Write-Error ('Failed modules: ' + ($failed -join ', '))
            exit 1
          }
