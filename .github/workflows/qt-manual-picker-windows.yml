name: Qt manual picker Windows integration

on:
  push:
    branches: [fix/qt-manual-picker-takeover-20261102]
  pull_request:
    paths:
      - 'app/manual_map_picker*.py'
      - 'experiments/qt_quick/**'
      - '.github/workflows/qt-manual-picker-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-picker:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'app;tests;tools;experiments/qt_quick'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Install pinned official PyPI test dependencies (no build or release)
        id: dependencies
        run: |
          python -m pip install --disable-pip-version-check -r experiments/qt_quick/requirements-client.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Picker, settings compatibility, real QML and QtClient exit
        run: |
          python -B -X utf8 -m unittest -v test_client_settings test_hotkey_layout_compat test_client_manual_map test_client_manual_map_integration test_client_session test_client_shutdown test_client_notification_geometry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Merged shortcut input and map lifecycle contracts (all failures retained)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -X utf8 -m unittest -v test_client_modifier_shortcuts test_client_native_key_state test_client_native_mouse test_client_input_event_freshness test_client_input_recovery test_client_shortcut_delivery test_client_input test_client_onboarding test_client_coordinator test_client_floor_region test_client_map_intent_reset test_client_map_input test_client_live_runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
