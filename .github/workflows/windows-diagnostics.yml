name: Windows diagnostics contracts
on:
  push:
    branches: [cloud/diagnostics-main-20261102]
  pull_request:
    paths:
      - 'app/**'
      - 'experiments/qt_quick/**'
      - 'tests/**'
      - '.github/workflows/windows-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONPATH: 'app;experiments/qt_quick'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.3'
      - name: Install runtime test dependencies
        run: python -m pip install -r experiments/qt_quick/requirements-client.txt
      - name: Shared logs, privacy, identity, ownership and environment
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_diagnostic*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_async_event_log.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_automatic_failure_samples.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_automatic_evidence_rotation.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_default_failure_evidence.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_automatic_failure_sample_admission.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_failure_capture*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_map_attempt_correlation.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_storage_retention.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_runtime_environment_diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qt production paths and same-input main comparison
        shell: pwsh
        run: |
          $modules = @('test_diagnostic_log_budget', 'test_diagnostic_noninterference', 'test_client_problems', 'test_client_problem_history', 'test_client_info', 'test_client_season_failure_export', 'test_client_diagnostic_integration', 'test_field_failure_samples', 'test_client_capture_full', 'test_client_capture_exclusion', 'test_client_lifecycle_trace.LifecycleTraceTests.test_existing_writer_rotation_has_fixed_total_bound', 'test_client_lifecycle_trace.LifecycleTraceTests.test_interpreter_exits_with_diagnostic_stream_write_blocked', 'test_client_settings', 'test_hotkey_layout_compat', 'test_client_manual_map', 'test_client_manual_map_integration', 'test_client_session', 'test_client_shutdown', 'test_client_notification_geometry', 'test_client_modifier_shortcuts', 'test_client_native_key_state', 'test_client_native_mouse', 'test_client_input_event_freshness', 'test_client_input_recovery', 'test_client_shortcut_delivery', 'test_client_input', 'test_client_onboarding', 'test_client_coordinator', 'test_client_floor_region', 'test_client_map_intent_reset', 'test_client_map_input', 'test_client_preparation_diagnostics', 'test_client_map_attempt_diagnostics', 'test_client_map_open_recovery', 'test_client_map_recovery_late_error', 'test_client_live_runtime')
          $failed = @()
          foreach ($module in $modules) {
            python -m unittest $module -v
            if ($LASTEXITCODE -ne 0) { $failed += $module }
          }
          if ($failed.Count -gt 0) {
            Write-Error ("Failed test modules: " + ($failed -join ", "))
            exit 1
          }
