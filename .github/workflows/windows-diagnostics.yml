name: Windows diagnostics contracts
on:
  push:
    branches: [cloud/diagnostics-e3-e2-e1-f2-20261102]
  pull_request:
    paths:
      - 'app/**'
      - 'experiments/qt_quick/**'
      - 'tests/**'
      - '.github/workflows/windows-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONPATH: 'app;experiments/qt_quick'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: python -m pip install -r requirements.txt -r experiments/qt_quick/requirements.txt
      - name: Shared logs, privacy, identity, ownership and environment
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_diagnostic*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_async_event_log.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_automatic_failure_samples.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_runtime_environment_diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qt production paths and same-input hotfix comparison
        shell: pwsh
        run: |
          $modules = @('test_diagnostic_noninterference', 'test_client_problems', 'test_client_problem_history', 'test_client_info', 'test_client_diagnostic_integration', 'test8f8b_diagnostics_sampling', 'test_field_failure_samples', 'test_client_preparation_diagnostics', 'test_client_pointer_diagnostics', 'test_client_live_runtime', 'test_client_capture_full', 'test_client_capture_exclusion', 'test_client_capture_compat')
          $failed = @()
          foreach ($module in $modules) {
            python -m unittest $module -v
            if ($LASTEXITCODE -ne 0) { $failed += $module }
          }
          if ($failed.Count -gt 0) {
            Write-Error ("Failed test modules: " + ($failed -join ", "))
            exit 1
          }
