name: Qt map window feedback Windows regression

on:
  push:
    branches: [fix/map-window-shape-feedback]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window-feedback:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'app;tests;tools;experiments/qt_quick'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: candidate
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          persist-credentials: false
      - name: Check out exact main baseline for same-module comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 59bba3dcea90811964688960f0b8086e345f3c77
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Install pinned test dependencies (no build or release)
        id: dependencies
        run: |
          python -m pip install --disable-pip-version-check -r experiments/qt_quick/requirements-client.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Nine window feedback regressions through preparation and Qt signals
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -X utf8 -m unittest -v test_client_window_feedback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Candidate runtime and coordinator regressions (retain every failure)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -X utf8 -m unittest -v test_client_live_runtime test_client_coordinator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact main same-module baseline (not a substitute for candidate pass)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: baseline
        run: |
          python -B -X utf8 -m unittest -v test_client_live_runtime test_client_coordinator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
