name: Qt transient fit reporting Windows regression

on:
  push:
    branches: [fix/transient-fit-reporting]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporting:
    name: Reporting (${{ matrix.source }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [candidate, main-baseline]
    env:
      PYTHONPATH: 'app;tests;tools;experiments/qt_quick'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.source == 'main-baseline' && '59bba3dcea90811964688960f0b8086e345f3c77' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Install pinned test dependencies (no build or release)
        id: dependencies
        run: |
          python -m pip install --disable-pip-version-check -r experiments/qt_quick/requirements-client.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shared regression suite (failures retained for baseline comparison)
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: |
          git rev-parse HEAD
          python -B -X utf8 -m unittest -v test_client_live_runtime test_client_coordinator test_client_map_intent_reset test_client_problems test_client_control_stability
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: All 17 new reporting and real problem-consumer regressions
        if: ${{ always() && matrix.source == 'candidate' && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -X utf8 -m unittest -v test_client_fit_reporting
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
