name: Qt hotkey layout compatibility
on:
  push:
    branches: [fix/qt-hotkey-layout-compat]
  pull_request:
    paths:
      - experiments/qt_quick/client_settings.py
      - experiments/qt_quick/test_hotkey_layout_compat.py
      - experiments/qt_quick/test_client_settings.py
      - experiments/qt_quick/requirements.txt
      - experiments/qt_quick/requirements-client.txt
      - .github/workflows/qt-hotkey-layout-compat.yml
permissions:
  contents: read
jobs:
  settings:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: experiments/qt_quick
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r experiments/qt_quick/requirements-client.txt
      - run: python -m unittest -v test_hotkey_layout_compat test_client_settings
